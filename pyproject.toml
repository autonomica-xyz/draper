[project]
name = "draper"
version = "0.1.0"
description = "Local-first AI marketing content orchestration pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Draper contributors"}
]
keywords = ["marketing", "ai", "content", "automation", "social-media", "typefully"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.2",
    "litellm>=1.89.2",
    "tenacity>=8.2.0",
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "mcp[cli]>=2.1.1",
    "nostr-sdk>=0.45.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
draper = "cli:main"
draper-mcp = "mcp_server.server:main"
draper-worker = "worker:main"

[project.urls]
Homepage = "https://github.com/your-org/draper"
Documentation = "https://github.com/your-org/draper#readme"
Repository = "https://github.com/your-org/draper"
Issues = "https://github.com/your-org/draper/issues"
Security = "https://github.com/your-org/draper/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "analytics",
    "dashboard",
    "data",
    "feedback",
    "generator",
    "integrations",
    "learning",
    "mcp_server",
    "media",
    "nostr",
    "orchestrator",
    "projects",
    "reasoning",
    "scheduler",
    "services",
]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"worker.py" = "worker.py"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E402",  # Runtime sys.path/.env setup precedes some imports in executable modules
    "E501",  # Line too long - handled by formatter
    "E722",  # Legacy broad exception handlers need targeted cleanup
    "F541",  # Legacy f-strings without placeholders
    "F841",  # Legacy unused locals
    "I001",  # Import ordering cleanup is tracked separately
    "N806",  # Existing tests use unittest.mock's Mock* naming convention
    "N818",  # Existing tests use custom test exception naming
    "W291",  # Legacy trailing whitespace
    "W293",  # Legacy blank-line whitespace
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
override-dependencies = [
    "openai>=3.8.0",
    "importlib-metadata>=9.0.1",
]
